            return "Hello JavaScript";
        };

        console.log(message());

        const welcome = (name) => {
            return `Hello ${name}, welcome to JavaScript`;
        };

        console.log(welcome("Sakthi"));

            console.log("Welcome to SECE");
            stud();
        }

        }

        sece(stud);

            console.log("Welcome to SECE");

        }

            } else {
                reject("Failed to fetch");
            }

        });

        fetch_api
            .then(data => console.log(data))
            .catch(error => console.log(error));

        let zomato_order = new Promise((resolve, reject) => {

            setTimeout(() => {

                    reject("Food order failed!");

        console.log("String Data:", stringify_data);

        let parsed_data = JSON.parse(stringify_data);

        console.log("Parsed Data:", parsed_data);

        let copied_data = { ...emp[1] };

        copied_data.salary = 80000;

        console.log("Original Data:", emp[1]);
